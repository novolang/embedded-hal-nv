[package]
name        = "embedded-hal-nv"
version     = "0.4.0"
description = "The peripheral traits a device program is written against: GPIO, UART, timers, SPI, I2C, CAN with FD frames and filters, I2S, PDM input, ADC, PWM, block storage and the watchdog, each as a sync trait and, where the hardware completes in the background, an async one, plus the awaitable form a microcontroller awaits.  The traits forward to the board's hal hooks, and the package implements them for the board's handles, so one program builds for every board and no board writes an implementation."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["embedded", "hal", "gpio", "uart", "spi", "i2c", "can", "i2s", "pdm", "audio", "watchdog", "timer", "microcontroller", "traits"]
repository  = "https://github.com/novolang/embedded-hal-nv"
maintainers = ["novo-lang"]
# 0.19.3 is the first release whose standard library has hal.can, a
# layer over the CAN controller a board names with @hal(can), which the
# bodies of CanBus call.  The bodies of Watchdog and reset_reason call
# hal.watchdog, which a toolchain built from the novo-lang repository's
# main has, and the first release after 0.19.3 carries.
novo        = ">= 0.19.4"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Writing a device program once for every board"

[dependencies]
# None.  The traits name the language's own types and `core.rt`'s
# Future, and nothing else.
